name: Release Codex Sessions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: specstory-cli/go.sum

      - name: Verify tag belongs to dev
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev

      - name: Validate release contract
        run: ./scripts/validate-release-config.sh

      - name: Publish GitHub release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
