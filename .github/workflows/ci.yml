name: CI

# Scoped to the Go CLI: lore/ has its own workflow (lore-validate.yml).
# paths and paths-ignore cannot be combined on one event, so exclusions are ! patterns.
on:
  push:
    branches: [dev, main]
    paths:
      - 'specstory-cli/**'
      - '.goreleaser.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'install.sh'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
      - '!**/.specstory/**'
  pull_request:
    paths:
      - 'specstory-cli/**'
      - '.goreleaser.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'install.sh'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
      - '!**/.specstory/**'

jobs:
  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: specstory-cli/go.sum
      - name: Validate release contract
        run: ./scripts/validate-release-config.sh
      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Test snapshot installer
        env:
          VERSION: v0.0.0
          DOWNLOAD_BASE_URL: file://${{ github.workspace }}/dist
          INSTALL_DIR: ${{ runner.temp }}/csessions-bin
        run: |
          mkdir -p "$INSTALL_DIR"
          ./install.sh
          "$INSTALL_DIR/csessions" version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specstory-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: specstory-cli/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: specstory-cli

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specstory-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: specstory-cli/go.sum
      - name: Run tests
        run: go test ./...
